<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stripe Checkout Flow</title>
    <!-- 1. Load Stripe.js SDK -->
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 450px; margin: 40px auto; padding: 20px; }
        button { background: #5469d4; color: white; border: none; padding: 12px 16px; width: 100%; border-radius: 4px; cursor: pointer; font-size: 16px; margin-bottom: 15px; }
        button:disabled { background: #a5a5a5; cursor: not-allowed; }
        .hidden { display: none; }
        #error-message { color: #df1b41; margin-top: 10px; }
    </style>
</head>
<body>

<h2>Complete Your Purchase</h2>

<!-- Step 1 UI: Button to trigger PaymentIntent creation on Backend -->
<div id="init-section">
    <button id="init-btn" onclick="initiatePayment()">Pay $20.00</button>
</div>

<!-- Step 2 UI: Stripe Elements Container (Hidden until PaymentIntent is ready) -->
<form id="payment-form" class="hidden">
    <div id="payment-element">
        <!-- Stripe Payment Element mounts here dynamically -->
    </div>
    <button id="submit-btn" type="submit" style="margin-top: 20px;">Submit Payment</button>
    <div id="error-message"></div>
</form>

<script>
    // Initialize Stripe with your Publishable Key (pk_test_...)
    const stripe = Stripe('pk_test_51TvUtnKGW0rhEPM0wmfhgpybK3jT22cnq5No6WGDRsMucWqBGnAwIGknUeuipSpIH811zvqXH5tPKLGOEr0avBrS00mhFPn54K');

    let elements;
    let clientSecret;

    // STEP 1: Click button -> Call Spring Boot -> Get clientSecret
    async function initiatePayment() {
        const btn = document.getElementById('init-btn');
        btn.disabled = true;
        btn.innerText = "Creating Payment Intent...";

        try {
            const response = await fetch('http://localhost:8080/api/payments/create-payment-intent', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ amount: 2000, currency: 'usd' }) // $20.00
            });

            if (!response.ok) throw new Error("Failed to create PaymentIntent");

            const data = await response.json();
            clientSecret = data.clientSecret; // e.g., pi_3Tv..._secret_xyz

            // Mount Stripe Elements now that we have the clientSecret
            setupStripeElements(clientSecret);

        } catch (err) {
            document.getElementById('error-message').innerText = err.message;
            btn.disabled = false;
            btn.innerText = "Pay $20.00";
        }
    }

    // STEP 2: Render Stripe's pre-built Card UI
    function setupStripeElements(secret) {
        // Hide the initial pay button and show the card form
        document.getElementById('init-section').classList.add('hidden');
        document.getElementById('payment-form').classList.remove('hidden');

        // Create Elements instance scoped to this PaymentIntent
        elements = stripe.elements({ clientSecret: secret });

        // Create and mount the UI Component inside <div id="payment-element">
        const paymentElement = elements.create('payment');
        paymentElement.mount('#payment-element');
    }

    // STEP 3: Confirm payment with Stripe directly from frontend
    document.getElementById('payment-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const submitBtn = document.getElementById('submit-btn');
        submitBtn.disabled = true;
        submitBtn.innerText = "Processing...";

        const { error } = await stripe.confirmPayment({
            elements,
            confirmParams: {
                // Redirect URL after payment succeeds
                return_url: 'http://localhost:8080/payment-success.html',
            },
        });

        // This only executes if there is an immediate error (e.g., card declined)
        if (error) {
            document.getElementById('error-message').innerText = error.message;
            submitBtn.disabled = false;
            submitBtn.innerText = "Submit Payment";
        }
    });
</script>
</body>
</html>
