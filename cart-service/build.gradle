plugins {
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.5'
    id 'java'
}

group = 'com.ecommerce'
version = '1.0.0'
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    
    // Spring Security
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation group: 'com.mysql', name: 'mysql-connector-j', version: '8.1.0'
    //implementation 'mysql:mysql-connector-j:8.4.0'
    //implementation 'mysql:mysql-connector-j:8.1.0'
     //implementation 'mysql:mysql-connector-j:8.0.35'
// https://mvnrepository.com/artifact/mysql/mysql-connector-java
  //implementation("mysql:mysql-connector-java:8.0.33")
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // ✅ Add this line to include your common-lib
    implementation 'com.commonlib:common-lib:1.0.0-SNAPSHOT'
    
    
    
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
